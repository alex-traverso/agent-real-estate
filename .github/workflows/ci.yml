name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-api:
    name: Check API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared types
        run: yarn workspace types build

      - name: Typecheck
        run: yarn workspace api tsc --noEmit

      - name: Lint
        run: yarn workspace api eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: yarn workspace api build

  check-admin:
    name: Check Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared types
        run: yarn workspace types build

      - name: Typecheck
        run: yarn workspace admin tsc --noEmit

      - name: Lint
        run: yarn workspace admin lint

      - name: Build
        run: yarn workspace admin build
